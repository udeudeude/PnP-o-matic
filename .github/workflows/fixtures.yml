name: Generate PnP-o-matic test fixtures
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fixtures.yml'
      - 'test-fixtures/generators/**'
jobs:
  build-fixtures:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-lato
          python -m pip install pillow reportlab pypdf pymupdf
      - name: Generate and validate all test fixtures
        run: |
          python test-fixtures/generators/generate.py
          python test-fixtures/generators/make_catalog.py
          python test-fixtures/generators/verify.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-fixtures
          if ! git diff --cached --quiet; then
            git commit -m "Add generated PnP-o-matic test PDFs and images"
            git push origin HEAD:main
          fi
